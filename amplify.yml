version: 1
frontend:
  phases:
    preBuild:
      commands:
        - git fetch --unshallow || true
        - git fetch --tags --force
        - |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends latexmk texlive-xetex texlive-latex-extra
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y texlive-xetex texlive-latex
            sudo yum install -y latexmk || true
          else
            echo "ERROR: Unsupported package manager; cannot install LaTeX toolchain"
            exit 1
          fi
        - xelatex --version
        - latexmk --version || true
        - export PYENV_ROOT="$HOME/.pyenv"
        - export PATH="$PYENV_ROOT/bin:$PATH"
        - eval "$(pyenv init -)"
        - pyenv install -s 3.11.11
        - pyenv global 3.11.11
        - python --version
        - pip install --upgrade pip
        - pip3 install -r requirements.txt
    build:
      commands:
        - bash build_versions.sh
  artifacts:
    baseDirectory: _build/html
    files:
      - '**/*'
  cache:
    paths: []
