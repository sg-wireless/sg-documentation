version: 1
frontend:
  phases:
    preBuild:
      commands:
        - git fetch --unshallow || true
        - git fetch --tags --force
        - pip3 install -r requirements.txt
    build:
      commands:
        - bash build_versions.sh
  artifacts:
    baseDirectory: _build/html
    files:
      - '**/*'
  cache:
    paths: []
