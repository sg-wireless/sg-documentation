{# Version selector sidebar panel for sphinx-multiversion #}
{% if versions %}
<div class="rst-versions" data-toggle="rst-versions" role="note" aria-label="versions">
  <span class="rst-current-version" data-toggle="rst-current-version">
    <span class="fa fa-book"> SG Wireless Docs</span>
    v: {{ current_version }}
    <span class="fa fa-caret-down"></span>
  </span>
  <div class="rst-other-versions">
    <dl>
      <dt>Versions</dt>
      {% for item in versions %}
      <dd><a href="{{ item.url }}">{{ item.name }}</a></dd>
      {% endfor %}
    </dl>
    <dl>
      <dt>Downloads</dt>
      <dd><a href="{{ pathto('_static/SGWirelessDocs.pdf', 1) }}">PDF</a></dd>
    </dl>
    <dl>
      <dt>On GitHub</dt>
      <dd><a href="https://github.com/sg-wireless/sg-docs">sg-docs repository</a></dd>
    </dl>
  </div>
</div>
{% endif %}
